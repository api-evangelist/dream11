aid: dream11
name: Dream11
description: 'Dream11 is India''s largest fantasy sports platform, operated by Sporta
  Technologies Private Limited and part of the Dream Sports group founded in 2008 by
  Harsh Jain and Bhavit Sheth and headquartered in Mumbai. Launched as a freemium
  fantasy game in 2012, it lets 140 million-plus users draft virtual teams and compete
  in free and paid contests across cricket, football, kabaddi, basketball and hockey,
  scoring on the real-world performance of the athletes they pick. Dream11 is a
  consumer, mobile-first product with no public consumer API program; its engineering
  organization does maintain public open-source infrastructure (Kong rate-limiter
  and circuit-breaker plugins, the Odin deployment tool) on GitHub and publishes an
  engineering blog.'
